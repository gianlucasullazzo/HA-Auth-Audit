name: Release

# Creates tag + GitHub release v<version> whenever the version in
# manifest.json changes on main and that tag does not exist yet.
on:
  push:
    branches: [main]
    paths:
      - custom_components/auth_audit/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        run: |
          version=$(jq -r .version custom_components/auth_audit/manifest.json)
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create release if the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists, nothing to do"
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
